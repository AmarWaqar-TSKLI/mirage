[project]
name = "mirage-common"
version = "0.1.0"
description = "Shared event format and helpers used by every Mirage component"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mirage_common"]
