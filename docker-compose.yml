# Mirage lab.
#
# Networks:
#   lab  - internal (no internet). Decoys, the controller and the attacker live here.
#   mgmt - normal bridge. Only the controller joins it, so the dashboard is
#          reachable from the host and the controller can reach the LLM API.
#          Decoys never get internet access directly.
#
# Before the first run, generate this deployment's fake secrets:
#   python3 tools/gen_honeytokens.py   ->  config/honeytokens.local.json

name: mirage

services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    environment:
      # Each decoy has its own token (run tools/gen_secrets.py). The controller
      # holds all three so it can check that every event comes from the decoy it
      # claims to, and push block/tarpit/clear to each decoy with its own token.
      MIRAGE_TOKEN_ADMIN_PANEL: ${MIRAGE_TOKEN_ADMIN_PANEL:?run tools/gen_secrets.py}
      MIRAGE_TOKEN_SSH: ${MIRAGE_TOKEN_SSH:?run tools/gen_secrets.py}
      MIRAGE_TOKEN_S3: ${MIRAGE_TOKEN_S3:?run tools/gen_secrets.py}
      # Key the dashboard needs for Contain / Release / Reset.
      MIRAGE_OPERATOR_TOKEN: ${MIRAGE_OPERATOR_TOKEN:?run tools/gen_secrets.py}
      MIRAGE_DB_PATH: /data/mirage.db
      MIRAGE_HONEYTOKENS: /etc/mirage/honeytokens.json
      # Decoy control servers the containment engine pushes block/tarpit/clear to.
      MIRAGE_SSH_CONTROL_URL: http://10.66.0.21:8022
      MIRAGE_DECOY_CONTROL_URLS: admin-panel=http://10.66.0.20:8020,ssh=http://10.66.0.21:8022,s3=http://10.66.0.22:8090
      # active (default) = respond on risk; observe = watch only (eval observe mode).
      MIRAGE_RESPONSE_MODE: ${MIRAGE_RESPONSE_MODE:-active}
    volumes:
      - controller-data:/data
      - ./config/honeytokens.local.json:/etc/mirage/honeytokens.json:ro
    networks:
      lab:
        ipv4_address: 10.66.0.10
      mgmt: {}
    ports:
      - "127.0.0.1:8000:8000"   # dashboard/API, host-only
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  admin-panel:
    build:
      context: .
      dockerfile: decoys/admin-panel/Dockerfile
    environment: &decoy-env
      MIRAGE_CONTROLLER_URL: http://10.66.0.10:8000
      # A decoy only ever holds its own token.
      MIRAGE_INGEST_TOKEN: ${MIRAGE_TOKEN_ADMIN_PANEL:?run tools/gen_secrets.py}
      MIRAGE_HONEYTOKENS: /etc/mirage/honeytokens.json
    volumes:
      - ./config/honeytokens.local.json:/etc/mirage/honeytokens.json:ro
    networks:
      lab:
        ipv4_address: 10.66.0.20
    depends_on: [controller]
    restart: unless-stopped

  ssh:
    build:
      context: .
      dockerfile: decoys/ssh/Dockerfile
    environment:
      <<: *decoy-env
      MIRAGE_INGEST_TOKEN: ${MIRAGE_TOKEN_SSH:?run tools/gen_secrets.py}
      MIRAGE_DATA_DIR: /data
    volumes:
      - ./config/honeytokens.local.json:/etc/mirage/honeytokens.json:ro
      - ssh-data:/data          # host key and session recordings (evidence)
    networks:
      lab:
        ipv4_address: 10.66.0.21
    depends_on: [controller]
    restart: unless-stopped

  s3:
    build:
      context: .
      dockerfile: decoys/s3/Dockerfile
    environment:
      <<: *decoy-env
      MIRAGE_INGEST_TOKEN: ${MIRAGE_TOKEN_S3:?run tools/gen_secrets.py}
    volumes:
      - ./config/honeytokens.local.json:/etc/mirage/honeytokens.json:ro
    networks:
      lab:
        ipv4_address: 10.66.0.22
    depends_on: [controller]
    restart: unless-stopped

  # ----- Evaluation (step 8), started only with: docker compose --profile eval up
  legit:
    image: nginx:alpine
    profiles: ["eval"]
    volumes:
      - ./eval/legit-site:/usr/share/nginx/html:ro
    networks:
      lab:
        ipv4_address: 10.66.0.30
    restart: unless-stopped

  attacker:
    build:
      context: .
      dockerfile: eval/Dockerfile.attacker
    profiles: ["eval"]
    networks:
      lab:
        ipv4_address: 10.66.0.50
    depends_on: [admin-panel, ssh, s3]

  benign:
    build:
      context: .
      dockerfile: eval/Dockerfile.attacker
    profiles: ["eval"]
    networks:
      lab:
        ipv4_address: 10.66.0.51
    depends_on: [legit]

networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.66.0.0/24
  mgmt: {}

volumes:
  controller-data:
  ssh-data:
