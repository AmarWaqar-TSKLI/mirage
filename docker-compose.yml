# Mirage lab.
#
# Networks:
#   lab  - internal (no internet). Decoys, the controller and the attacker live here.
#   mgmt - normal bridge. Only the controller joins it, so the dashboard is
#          reachable from the host and the controller can reach the LLM API.
#          Decoys never get internet access directly.

name: mirage

services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    environment:
      MIRAGE_INGEST_TOKEN: ${MIRAGE_INGEST_TOKEN:?set MIRAGE_INGEST_TOKEN in .env}
      MIRAGE_DB_PATH: /data/mirage.db
      MIRAGE_HONEYTOKENS: /etc/mirage/honeytokens.json
    volumes:
      - controller-data:/data
      - ./config/honeytokens.json:/etc/mirage/honeytokens.json:ro
    networks:
      lab:
        ipv4_address: 10.66.0.10
      mgmt: {}
    ports:
      - "127.0.0.1:8000:8000"   # dashboard/API, host-only
    restart: unless-stopped

  admin-panel:
    build:
      context: .
      dockerfile: decoys/admin-panel/Dockerfile
    environment: &decoy-env
      MIRAGE_CONTROLLER_URL: http://10.66.0.10:8000
      MIRAGE_INGEST_TOKEN: ${MIRAGE_INGEST_TOKEN:?set MIRAGE_INGEST_TOKEN in .env}
      MIRAGE_HONEYTOKENS: /etc/mirage/honeytokens.json
    volumes:
      - ./config/honeytokens.json:/etc/mirage/honeytokens.json:ro
    networks:
      lab:
        ipv4_address: 10.66.0.20
    depends_on: [controller]
    restart: unless-stopped

  # The ssh and s3 decoys and the attacker container are added in later steps.

networks:
  lab:
    internal: true
    ipam:
      config:
        - subnet: 10.66.0.0/24
  mgmt: {}

volumes:
  controller-data:
